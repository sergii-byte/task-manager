<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ordify">
  <!-- The "o" as a dial with one tenth of an hour filled — the unit a practice
       bills in. One ring, one arc: still legible at 16px. -->
  <rect width="512" height="512" rx="116" fill="#2f5d3f"/>
  <g transform="translate(256 256)">
    <circle r="136" fill="none" stroke="#eef4ef" stroke-width="36" opacity="0.3"/>
    <circle r="136" fill="none" stroke="#eef4ef" stroke-width="36" stroke-linecap="round"
            transform="rotate(-90)"
            stroke-dasharray="85.45 769.06" />
  </g>
</svg>
