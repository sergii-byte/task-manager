<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f5d3f">
<title>ordify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=80">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>

<div id="auth-gate">
    <div class="auth-card">
        <div class="auth-brand">ordify</div>
        <div class="auth-sub">your practice, organized.</div>
        <p class="auth-text">Sign in with Google to sync across your devices and your team.</p>
        <button id="auth-signin" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
                <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Continue with Google
        </button>
        <div id="auth-error" class="auth-error" hidden></div>
        <div class="auth-foot">Data stored in Google Firebase · EU region</div>
    </div>
</div>

<aside id="sidebar">
    <a class="brand" href="#/today">ordify</a>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
        <div id="account-chip"></div>
        <button id="settings-btn" title="Settings"><svg class="ic-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg> Settings</button>
    </div>
</aside>

<main id="main">
    <header id="topbar">
        <div id="timer-strip" hidden>
            <span class="dot"></span>
            <span id="timer-label">—</span>
            <span id="timer-clock">00:00:00</span>
            <button id="timer-stop">stop</button>
        </div>
        <div id="omni">
            <input id="omni-input" type="text" autocomplete="off" spellcheck="false"
                   placeholder="Type, dictate or attach — AI will figure it out  (⌘K)">
            <button id="omni-inbox" title="Inbox — turn email into tasks" aria-label="Email inbox"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span id="inbox-badge" class="inbox-badge" hidden></span></button>
            <button id="omni-attach" title="Attach a document or image (.docx, PDF, image, .txt)" aria-label="Attach file"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7L14 5.5a3.5 3.5 0 015 5L10.5 19a2 2 0 01-3-3L15 8.5"/></svg></button>
            <button id="omni-mic" title="Dictate (uk-UA / ru-RU)" aria-label="Voice input"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
            <button id="omni-ai" title="Ask Claude (⌘+Enter)" aria-label="AI parse"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></button>
        </div>
        <div id="omni-scrim" hidden></div>
        <div id="omni-panel" hidden></div>
    </header>
    <div id="view"></div>
</main>

<dialog id="modal">
    <form id="modal-form" method="dialog">
        <header><h2 id="modal-title">Edit</h2><button type="button" class="close" id="modal-close">×</button></header>
        <div id="modal-body"></div>
        <footer>
            <button type="button" id="modal-delete" class="danger">Delete</button>
            <span class="grow"></span>
            <button type="button" id="modal-cancel">Cancel</button>
            <button type="submit" id="modal-save" class="primary">Save</button>
        </footer>
    </form>
</dialog>

<div id="toast" hidden></div>

<!-- Firebase SDK (compat build — exposes global `firebase`) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js?v=80"></script>

<!-- Google Identity Services — loaded eagerly so the OAuth popup can fire
     synchronously from a click (avoids the browser popup blocker) -->
<script src="https://accounts.google.com/gsi/client" async></script>

<!-- fflate — in-browser unzip, used to read .docx invoices -->
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<!-- App -->
<script src="app.js?v=80"></script>
<script src="attach.js?v=80"></script>
<script src="google.js?v=80"></script>
<script src="docimport.js?v=80"></script>
<script src="omni.js?v=80"></script>
<script src="auth.js?v=80"></script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed', err));
    });
}
</script>
</body>
</html>
